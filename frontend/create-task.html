<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Issue</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal {
            background: white;
            border-radius: 1rem;
            width: 90%;
            max-width: 560px;
            padding: 1.5rem;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            font-size: 1.4rem;
            font-weight: 600;
        }
        .close-btn {
            background: none;
            border: none;
            font-size: 1.8rem;
            cursor: pointer;
            color: #999;
        }
        label {
            display: block;
            margin: 1rem 0 0.4rem;
            font-size: 0.9rem;
            color: #555;
            font-weight: 500;
        }
        .input, select, textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #ddd;
            border-radius: 0.5rem;
            background: #f9f9f9;
            font-size: 1rem;
        }
        .input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #635bff;
            box-shadow: 0 0 0 3px rgba(99,91,255,0.15);
        }
        .row {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        .row > div { flex: 1; }
        .attachment {
            padding: 1rem;
            background: #f4f5f7;
            border-radius: 0.5rem;
            text-align: center;
            color: #666;
            margin: 1rem 0;
            border: 1px dashed #ddd;
        }
        .attachment a { color: #635bff; text-decoration: none; }
        .btn-group {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            margin-top: 2rem;
        }
        .btn-cancel {
            background: transparent;
            color: #666;
            border: none;
            padding: 0.7rem 1.5rem;
            cursor: pointer;
            font-weight: 500;
        }
        .btn-create {
            background: #635bff;
            color: white;
            padding: 0.7rem 1.8rem;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <div>Create</div>
                <button class="close-btn">&times;</button>
            </div>

            <form id="createTaskForm">
                
                <label>Project</label>
                <select class="input" required>
                    <option>⭐ Task Forge Frontend</option>
                </select>

               
                <label>Issue type</label>
                <select class="input" required>
                    <option>📖 Story</option>
                    <option>🐛 Bug</option>
                    <option>✅ Task</option>
                    <option>⚡ Epic</option>
                </select>

                
                <label>Summary</label>
                <input type="text" class="input" placeholder="" required>

                
                <label>Attachment</label>
                <div class="attachment">
                    Drop files to attach or <a href="#">Browse</a>
                </div>

                
                <label>Assignee</label>
                <input type="text" class="input" placeholder="Unassigned">

                <label>Description</label>
                <textarea class="input" rows="4" placeholder=""></textarea>

               
                <div class="row">
                    <div>
                        <label>Priority</label>
                        <select class="input">
                            <option>Highest</option>
                            <option>High</option>
                            <option>Medium</option>
                            <option>Low</option>
                            <option>Lowest</option>
                        </select>
                    </div>
                    <div>
                        <label>Reporter</label>
                        <input type="text" class="input" value="Timur Sandanov" readonly>
                    </div>
                </div>

                
                <label>Due date</label>
                <input type="text" class="input" placeholder="Select date">

                
                <div class="btn-group">
                    <button type="button" class="btn-cancel">Cancel</button>
