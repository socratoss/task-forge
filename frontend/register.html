<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <div class="card">
        <h1>Sign up</h1>

        <form id="registerForm">
            <div class="input-group">
                <input type="email" name="email" placeholder="Email address" required>
            </div>

            <div class="input-group">
                <input type="password" name="password" placeholder="Password" required>
            </div>

            <button type="submit" class="btn-primary" style="background: linear-gradient(135deg, #ffdf88 0%, #ffd43b 100%);">
                Create account
            </button>
        </form>

        <div class="text-center" style="margin: 1.5rem 0; color: #888; font-size: 0.9rem;">OR</div>

        <a href="index.html" class="btn-primary" style="background: #fff2cc; color: #333; border: 1px solid #ffe066;">
            Log in
        </a>

        <a href="index.html" class="link mt-1">Already have an account?</a>
    </div>

    <script src="assets/js/auth.js"></script>
</body>
</html>
