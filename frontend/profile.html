<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body {
            background: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #333;
            padding: 2rem;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .profile-header {
            display: flex;
            gap: 2rem;
            margin-bottom: 3rem;
            align-items: flex-start;
        }
        .avatar-wrapper {
            position: relative;
            cursor: pointer;
        }
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #ddd;
            border: 4px solid #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            object-fit: cover;
        }
        .avatar-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.9rem;
        }
        .avatar-wrapper:hover .avatar-overlay { opacity: 1; }

        .header-info h1 {
            margin: 0 0 0.5rem;
            font-size: 2rem;
            font-weight: 600;
        }
        .header-info input {
            font-size: 1.8rem;
            font-weight: 600;
            border: none;
            background: transparent;
            border-bottom: 2px solid transparent;
            padding: 0.2rem 0;
        }
        .header-info input:focus {
            outline: none;
            border-bottom: 2px solid #635bff;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }
        .section {
            background: #f9f9f9;
            border-radius: 1rem;
            padding: 1.5rem;
        }
        .section-title {
            font-weight: 600;
            margin-bottom: 1rem;
            font-size: 1.3rem;
        }
        .info-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 1rem;
            padding: 0.7rem;
            background: white;
            border-radius: 0.75rem;
        }
        .info-item input, .info-item span {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 1rem;
        }
        .info-item input:focus {
            outline: none;
            background: #f0f0ff;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }
        .card {
            background: #e0e0e0;
            height: 120px;
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            color: #666;
            position: relative;
        }
        .add-card {
            background: #fff;
            border: 2px dashed #ccc;
            cursor: pointer;
            transition: all 0.3s;
        }
        .add-card:hover {
            background: #f0f8ff;
            border-color: #635bff;
            color: #635bff;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="profile-header">
            <div class="avatar-wrapper" onclick="document.getElementById('avatarInput').click()">
                <img src="" alt="Avatar" class="avatar" id="avatarPreview">
                <div class="avatar-overlay">Change photo</div>
                <input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="previewAvatar(event)">
            </div>
            <div class="header-info">
                <h1 contenteditable="true">Full name</h1>
            </div>
        </div>

        <div class="main-content">
            
            <div class="section">
                <div class="section-title">About</div>
                <div class="info-item">Mentor <input type="text" value="" placeholder="Your mentor"></div>
                <div class="info-item">Your department <input type="text" placeholder="Frontend Team"></div>
                <div class="info-item">Company <input type="text" value="Task Forge Inc."></div>
                <div class="info-item">Country <input type="text" placeholder="Country"></div>
                <div class="info-item">Email <input type="email" value="user@taskforge.com"></div>
            </div>

            
            <div>
                <div class="section">
                    <div class="section-title">Projects</div>
                    <div class="card-grid">
                        <div class="card">Task Forge</div>
                        <div class="card add-card" onclick="addCard(this, 'project')">+ Add project</div>
                    </div>
                </div>

                <div class="section" style="margin-top: 2rem;">
                    <div class="section-title">Tasks</div>
                    <div class="card-grid">
                        <div class="card">Implement login</div>
                        <div class="card">Create dashboard</div>
                        <div class="card add-card" onclick="addCard(this, 'task')">+ Add task</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
       
        function previewAvatar(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('avatarPreview').src = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        }

      
        function addCard(element, type) {
            const text = prompt(`Enter ${type} name:`);
            if (text && text.trim()) {
                const newCard = document.createElement('div');
                newCard.className = 'card';
                newCard.textContent = text.trim();
                element.parentNode.insertBefore(newCard, element);
            }
        }
    </script>
</body>
</html>
