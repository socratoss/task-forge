<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body {
            background: #fff;
            color: #333;
            padding: 2rem;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h2 {
            font-size: 1.6rem;
            margin: 2.5rem 0 1.5rem;
            font-weight: 600;
        }
        .section {
            margin-bottom: 3rem;
        }
        label {
            display: block;
            font-size: 0.95rem;
            margin-bottom: 0.5rem;
            color: #555;
        }
        input[type="password"],
        input[type="email"] {
            width: 100%;
            padding: 0.9rem 1.2rem;
            border: 1px solid #ddd;
            border-radius: 2rem;
            background: #f9f9f9;
            font-size: 1rem;
            margin-bottom: 1rem;
        }
        input:focus {
            outline: none;
            border-color: #aaa;
            background: #fff;
        }
        .btn {
            padding: 0.9rem 2rem;
            border: none;
            border-radius: 2rem;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        .btn-update-pw {
            background: #ddd;
            color: #333;
        }
        .btn-update-pw:hover {
            background: #ccc;
        }
        .divider {
            height: 1px;
            background: #eee;
            margin: 3rem 0;
        }
        .alert {
            padding: 0.9rem 1.4rem;
            background: #ffebe6;
            color: #d43f21;
            border-radius: 2rem;
            font-size: 0.95rem;
            margin-top: 1rem;
        }
        .btn-delete {
            background: #d43f21;
            color: white;
            padding: 1rem 2.5rem;
        }
        .btn-delete:hover {
            background: #c3361c;
        }
        .text-muted {
            color: #777;
            font-size: 0.9rem;
            margin-top: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="container">

        
        <div class="section">
            <h2>Password</h2>

            <label>New password</label>
            <input type="password" placeholder="New password">

            <label>Confirm New Password</label>
            <input type="password" placeholder="Confirm New Password">

            <button class="btn btn-update-pw">Update Password</button>
        </div>

        <div class="divider"></div>

        
        <div class="section">
            <h2>Update Email</h2>

            <p class="text-muted">
                You have used google when signing up.<br>
                Please set your password first.
            </p>

            <label>Current Email</label>
            <input type="email" placeholder="example@gmail.com" disabled style="background:#f0f0f0;">

            <div class="alert">
                Please set your password first to update your email.
            </div>
        </div>

        <div class="divider"></div>

        
        <div class="section">
            <h2>Delete Account</h2>

            <p class="text-muted">
                Permanently remove your account from the roadmap.sh. This cannot be undone and all your progress and data will be lost.
            </p>

            <button class="btn btn-delete">Delete Account</button>
        </div>

    </div>

</body>
</html>
