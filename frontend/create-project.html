<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create project</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body {
            background: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #333;
            padding: 3rem 2rem;
        }
        .container {
            max-width: 560px;
            margin: 0 auto;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 2.5rem;
        }
        label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.6rem;
            font-size: 1rem;
        }
        input[type="text"],
        select {
            width: 100%;
            padding: 0.9rem 1.2rem;
            border: 1px solid #ddd;
            border-radius: 2rem;
            background: #fff;
            font-size: 1rem;
            margin-bottom: 1.5rem;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #888;
            box-shadow: 0 0 0 3px rgba(0,0,0,0.05);
        }
        .key-input {
            background: #f4f5f7;
            color: #666;
        }
        .btn-group {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            margin-top: 3rem;
        }
        .btn-cancel {
            background: transparent;
            border: none;
            color: #555;
            font-size: 1rem;
            cursor: pointer;
            padding: 0.7rem 1.5rem;
        }
        .btn-create {
            background: #0052cc;
            color: white;
            border: none;
            padding: 0.7rem 2rem;
            border-radius: 2rem;
            font-weight: 500;
            cursor: pointer;
            font-size: 1rem;
        }
        .btn-create:hover {
            background: #003eab;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Create project</h1>

        <form id="createProjectForm">
            <div>
                <label>Name</label>
                <input type="text" placeholder="" required>
            </div>

            <div>
                <label>Key</label>
                <input type="text" class="key-input" placeholder="TF" readonly>
            </div>

            <div>
                <label>Team type</label>
                <select required>
                    <option value="">Select team type</option>
                    <option>Software</option>
                    <option>Business</option>
                    <option>Marketing</option>
                    <option>Operations</option>
                </select>
            </div>

            <div class="btn-group">
                <button type="button" class="btn-cancel">Cancel</button>
                <button type="submit" class="btn-create">Create</button>
            </div>
        </form>
    </div>

</body>
</html>
